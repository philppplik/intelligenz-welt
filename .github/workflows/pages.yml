name: Build and deploy
on:
  push:
    branches: [main]
  schedule:
    - cron: '17 */3 * * *'
  workflow_dispatch:
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Unpack sources
        run: |
          cat payload-*.b64 | base64 -d | tar xz --skip-old-files
          ls -R site | head -30
      - name: Fetch data and build
        working-directory: site
        run: |
          python3 data.py
          python3 build.py
          touch ../data/.keep
      - name: Persist archives
        run: |
          git config user.name "site-bot"; git config user.email "bot@users.noreply.github.com"
          git add data || true
          git commit -m "Update data archive" || true
          git push || true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site/out
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.d.outputs.page_url }}
    steps:
      - id: d
        uses: actions/deploy-pages@v4
